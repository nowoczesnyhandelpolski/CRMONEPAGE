<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Centrala CRM · Nowoczesny Handel Polski</title>
<link rel="icon" href="assets/brand/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#13294B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Motyw z logo Nowoczesny Handel Polski: granat (zaufanie), biel i czerwień (polska wstęga), krój Poppins.
   Motyw wstęgi biało-czerwonej wraca w nawigacji, kartach, paskach postępu i banerach widoków. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#13294B; --muted:#5B6782; --line:#DEE3EC;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-2:#13294B;
  --navy:#13294B; --navy-2:#0B1B35; --red:#C8102E; --red-l:#EF4058; --sky:#8FB0E6;
  --good:#12805C; --warn:#C98A00; --bad:#D9363E; --info:#2F6FD6; --violet:#6B4FD8; --grey:#8A93A8;
  --p1:#C8102E; --p2:#2F6FD6; --p3:#0E8A7D;
  --shadow:0 1px 2px rgba(19,41,75,.06),0 8px 24px -6px rgba(19,41,75,.12);
  --display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
  --ribbon:linear-gradient(#fff 0 50%,var(--red) 50%);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071226; --surface:#0E1F3D; --surface-2:#13284B; --ink:#EEF2FA; --muted:#9AA8C4; --line:#22385F;
    --accent:#E8304B; --accent-ink:#FFFFFF; --accent-2:#8FB0E6; --red:#E8304B;
    --good:#34C98A; --warn:#F0B429; --bad:#F2676B; --info:#6E9CFF; --violet:#A585FF; --grey:#8F9AB2;
    --p1:#EF4058; --p2:#6E9CFF; --p3:#2CC4B2;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071226; --surface:#0E1F3D; --surface-2:#13284B; --ink:#EEF2FA; --muted:#9AA8C4; --line:#22385F;
  --accent:#E8304B; --accent-ink:#FFFFFF; --accent-2:#8FB0E6; --red:#E8304B;
  --good:#34C98A; --warn:#F0B429; --bad:#F2676B; --info:#6E9CFF; --violet:#A585FF; --grey:#8F9AB2;
  --p1:#EF4058; --p2:#6E9CFF; --p3:#2CC4B2;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px 18px;color:#fff;display:flex;flex-direction:column;gap:20px;overflow-y:auto;
  background:radial-gradient(120% 50% at 0% 0%,#24477E 0,transparent 60%),linear-gradient(180deg,var(--navy) 0,var(--navy-2) 100%);box-shadow:4px 0 30px -12px rgba(11,27,53,.5);z-index:5}
.side::after{content:"";position:absolute;top:0;right:0;bottom:0;width:6px;background:linear-gradient(90deg,#fff 0 50%,var(--red) 50%);opacity:.9}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px;cursor:pointer;text-decoration:none;color:inherit;border-radius:12px}
.brand img{width:100%;max-width:210px;display:block}
.brand-box{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.brand-box img{width:40px;height:40px}
.brand b{font-family:var(--display);font-size:20px;font-weight:700;display:block;line-height:1.05}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-family:var(--display);font-weight:600}
.side-tag{margin:-8px 8px 0;font:600 10px/1 var(--display);letter-spacing:.38em;color:rgba(255,255,255,.55);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:12px;cursor:pointer;color:rgba(255,255,255,.72);font-weight:600;text-align:left;white-space:nowrap;transition:background .15s,color .15s,transform .15s}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(2px)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:6px;border-radius:0 4px 4px 0;background:linear-gradient(90deg,#fff 0 50%,var(--red) 50%)}
.nav button[aria-current="page"] svg{color:#fff}
.nav .count{margin-left:auto;font-size:11px;font-weight:800;background:var(--red);color:#fff;padding:1px 8px;border-radius:99px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-toggle .nav-end{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.nav-toggle .count{margin-left:0}
.nav-chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s ease;flex:none}
.nav-group[data-open="true"] .nav-chev{transform:rotate(-135deg) translateY(2px)}
.nav-group.is-on > .nav-toggle{color:#fff}
.nav-sub{display:none;flex-direction:column;gap:2px;margin:0 0 4px;padding:0 0 0 14px}
.nav-group[data-open="true"] > .nav-sub{display:flex}
.nav-sub button{padding:8px 10px;font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.06)}
.me label{font-size:11px;color:rgba(255,255,255,.6);display:block}
.me select{border:0;background:transparent;font-weight:700;padding:0;cursor:pointer;color:#fff}
.me select option{color:#13294B}
.side .btn{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
.side .btn:hover{background:rgba(255,255,255,.1);color:#fff}
.mainwrap{min-width:0;display:flex;flex-direction:column}

.main{padding:22px clamp(16px,3vw,36px) 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(24px,2.6vw,30px);font-weight:700;display:flex;align-items:center;gap:12px}
.top h1::before{content:"";width:8px;height:26px;border-radius:3px;background:linear-gradient(90deg,var(--navy) 0 50%,var(--red) 50%);flex:none}
.top p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:12px;font-weight:600;cursor:pointer;transition:transform .12s ease,background .15s,box-shadow .15s,color .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:inset 0 -4px 0 var(--red),0 6px 16px -4px rgba(19,41,75,.45);padding-bottom:11px}
.btn.primary:hover{background:var(--red);border-color:var(--red);box-shadow:inset 0 -4px 0 rgba(255,255,255,.35),0 8px 20px -4px color-mix(in srgb,var(--red) 55%,transparent);transform:translateY(-1px)}
:root[data-theme="dark"] .btn.primary{background:#1D3A68;border-color:#2A4F8A}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:13px;font-weight:600}
.kpi .val{font-family:var(--display);font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:2px}
.kpi::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--k,var(--accent))}
.kpi::before{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:20px;background:color-mix(in srgb,var(--k,var(--accent)) 10%,transparent);transform:rotate(18deg)}
.kpi{transition:transform .18s ease,box-shadow .18s}.kpi:hover{transform:translateY(-3px);box-shadow:0 14px 30px -12px rgba(19,41,75,.3)}
.dash2{grid-template-columns:1.55fr 1fr}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h .hint{color:var(--muted);font-size:13px}

.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:22px 24px 26px;margin-bottom:16px;position:relative;overflow:hidden;background:
  radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--red) 10%,transparent) 0,transparent 55%),
  radial-gradient(100% 120% at 0% 100%,color-mix(in srgb,var(--navy) 10%,transparent) 0,transparent 60%),var(--surface)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(var(--navy) 0 50%,var(--red) 50%);opacity:.9}
.hero .date{color:var(--muted);font-size:13px;font-weight:600}.hero .date::first-letter{text-transform:uppercase}
.hero h2{font-size:clamp(22px,2.4vw,28px);font-weight:700;margin-top:2px}
.hero .quote{margin-top:6px;color:var(--ink);opacity:.85}
.goal{margin-top:16px}
.goal-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:8px;flex-wrap:wrap}
.goal-top b{font-family:var(--display)}
.bar{height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(var(--navy) 0 50%,var(--red) 50%);background-size:100% 100%;position:relative;transition:width .8s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.bar > i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{to{transform:translateX(100%)}}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.stage{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--red)}
.ring{width:96px;height:96px}

.pipe{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 12px}
.pipe i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 -3px 0 var(--red)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.team{grid-template-columns:repeat(3,minmax(0,1fr))}
.mate{padding:16px;position:relative;overflow:hidden}
.mate::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mc,var(--navy))}
.mate .who{display:flex;align-items:center;gap:10px}
.mate .who b{font-size:16px}
.mate .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mate .stats div{background:var(--surface-2);border-radius:10px;padding:8px}
.mate .stats span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.mate .stats strong{font-family:var(--display);font-size:18px}
.star{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--red);color:#fff;letter-spacing:.02em}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;flex:none;font-family:var(--display)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--muted);font-size:12px}
.flag{width:4px;align-self:stretch;border-radius:4px;flex:none}
.empty{color:var(--muted);text-align:center;padding:30px 12px;font-size:14px}
.empty::before{content:"";display:block;width:64px;height:64px;margin:0 auto 12px;background:url(assets/brand/icon.svg) center/contain no-repeat;filter:drop-shadow(0 8px 16px rgba(19,41,75,.25));animation:emptyFloat 3.5s ease-in-out infinite}
@keyframes emptyFloat{50%{transform:translateY(-6px) rotate(-3deg)}}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;max-width:340px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px}
.search input{border:0;background:transparent;padding:9px 0;width:100%;outline:none}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface-2);text-transform:uppercase;letter-spacing:.08em;font-family:var(--display)}
th:first-child{border-top-left-radius:var(--r)}th:last-child{border-top-right-radius:var(--r)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.strong{font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.demo{border-style:dashed}
.pill{--c:var(--grey);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink));white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
select.pill{border:0;appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:12px}
select.pill::before{display:none}

.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcard{padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .15s ease,box-shadow .15s}
.pcard{position:relative;overflow:hidden}.pcard::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(var(--navy) 0 50%,var(--red) 50%);transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.pcard:hover{transform:translateY(-3px);box-shadow:0 16px 30px -14px rgba(19,41,75,.35)}.pcard:hover::after{transform:scaleX(1)}
.pcard h3{font-size:17px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv div{background:var(--surface-2);border-radius:9px;padding:6px 8px}
.kv span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.kv strong{font-size:15px}
.mbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c,var(--good))}

.kanban{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:240px;transition:background .15s}
.col.over{background:color-mix(in srgb,var(--accent) 10%,var(--surface-2));border-color:var(--accent)}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700}
.col-h .n{margin-left:auto;color:var(--muted);font-size:13px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab;box-shadow:var(--shadow);border-left:5px solid var(--c,var(--line));transition:transform .15s}.task:hover{transform:translateY(-2px)}
.task.dragging{opacity:.5}
.task b{display:block;font-size:14px}
.task .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.task .late{color:var(--bad);font-weight:700}
.task .mv{margin-left:auto;display:flex;gap:4px}
.task .mv button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;width:26px;height:24px;cursor:pointer;color:var(--muted)}
.done-t b{text-decoration:line-through;opacity:.6}

.two{grid-template-columns:1fr 1fr}
.ent{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ent:hover{background:var(--surface-2)}
.ent + .ent{border-top:1px solid var(--line)}
.ent .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent))}
.ent .t{flex:1;min-width:0}
.ent .t small{display:block;color:var(--muted);font-size:13px}

.banner{padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:14px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 12%,var(--surface))}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(7,18,38,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:40;overflow-y:auto}
.scrim.open{display:flex}
.modal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s ease;overflow:hidden}
.modal-h{background:linear-gradient(90deg,var(--navy),#1D3A68);color:#fff;border-bottom:0!important;position:relative}.modal-h::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:var(--ribbon)}.modal-h .btn{color:#fff;background:transparent;border-color:rgba(255,255,255,.25)}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:20px}
.modal-b{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal-f{display:flex;gap:10px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);border-color:var(--accent)}
/* zamówienie — strona szczegółów */
.od-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:4px 0 18px}
.od-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.od-title h1{font-size:28px;font-weight:600}.od-cust{font-size:26px;color:var(--muted);font-family:var(--display)}
.ostar.big{color:var(--muted)}.ostar.big.on{color:var(--warn)}
.obtn.round{border-radius:99px;width:44px;height:44px;font-size:22px;padding:0}.obtn.sm{height:34px;min-width:34px;padding:0 9px;font-size:13px}
.od-back{border-color:var(--info);color:var(--info);font-weight:700}
.od-card{margin-bottom:18px;overflow:visible}
.od-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 10px;flex-wrap:wrap}.od-h h2{font-size:21px;display:flex;align-items:center;gap:12px}
.od-dot{width:12px;height:12px;border-radius:50%;background:var(--info)}
.od-table th{background:transparent;border-bottom:2px solid var(--line)}.od-table td{vertical-align:middle}
.od-table tbody tr{cursor:default}.od-table tbody tr:hover td{background:transparent}
.od-ph{width:64px}.od-ph svg{display:block;width:46px;height:46px;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:var(--surface-2)}
.od-num{width:90px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--surface)}
.od-table td input:not(.od-num){width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit}
.od-prods-f{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 22px 18px}
.od-add{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:11px 20px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;max-width:100%}
.od-add:hover{background:var(--surface-2)}
.dd-r .dd-m{left:auto;right:0}
.od-grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:10px 30px;padding:4px 22px 20px}
.od-infowrap{position:relative}.od-pen{position:absolute;right:0;top:0}
.od-pay{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px;padding:4px 50px 14px 0;border-bottom:1px solid var(--line);margin-bottom:10px}
.od-paid{font-weight:800;padding:6px 14px;border-radius:6px;color:#fff;background:var(--grey)}.od-paid.full{background:var(--good)}.od-paid.part{background:var(--warn)}.od-paid.none{background:var(--bad)}
.od-info hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.od-kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:7px 16px;margin:0;font-size:15px}.od-kv dt{color:var(--ink);opacity:.85}.od-kv dd{margin:0;word-break:break-word;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.od-kv a{color:var(--info);display:inline-flex}
.od-dots{color:var(--muted)}
.od-side{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.od-st{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:16px}.od-sl{display:inline-flex;align-items:center;gap:6px;min-width:120px}
.od-st .obadge{font-size:14px;padding:6px 14px}
.od-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.od-grid3 .od-card .od-kv,.od-grid2b .od-card .od-kv{padding:0 22px 20px}
.od-grid2b{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.od-note{padding:0 22px 20px;margin:0}
.od-form{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:9px 14px;align-items:center;padding:4px 22px 6px}
.od-form .od-l{font-size:14px}.od-form input,.od-form select,.od-form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--surface);color:var(--ink)}
.od-form textarea{min-height:70px}
.od-actions{display:flex;justify-content:flex-end;gap:10px;padding:10px 22px 18px}
.od-infocard .od-grid2 > div > .od-card{margin:0;box-shadow:none;border:1px solid var(--line)}
.od-del{color:var(--bad)}
@media (max-width:1100px){.od-grid3{grid-template-columns:1fr 1fr}.od-grid2,.od-grid2b{grid-template-columns:1fr}}
@media (max-width:700px){.od-grid3{grid-template-columns:1fr}.od-title h1,.od-cust{font-size:21px}.od-kv,.od-form{grid-template-columns:1fr;gap:2px 0}.od-kv dd{margin-bottom:8px}.od-back{width:100%;justify-content:center}}
/* zamówienia — lista w stylu Base */
.olist{overflow:visible}
.olist-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}.olist-h h2{font-size:20px}
.otools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px 14px;border-bottom:1px solid var(--line)}
.ogrp{display:inline-flex}.ogrp > *:not(:first-child) .obtn,.ogrp > .obtn:not(:first-child){border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px}
.ogrp > *:not(:last-child) .obtn,.ogrp > .obtn:not(:last-child){border-top-right-radius:0;border-bottom-right-radius:0}
.obtn{display:inline-flex;align-items:center;gap:6px;height:40px;min-width:44px;justify-content:center;padding:0 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;font:inherit;font-weight:600;font-size:14px;list-style:none;transition:background .12s,border-color .12s}
.obtn::-webkit-details-marker{display:none}
.obtn:hover:not([disabled]){background:var(--surface-2);border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.obtn[disabled]{opacity:.4;cursor:not-allowed}
.obtn.danger:not([disabled]):hover,.obtn.sure{color:#fff;background:var(--red);border-color:var(--red)}
.dd-c{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.6}
details.dd{position:relative}details.dd[open] > .obtn{background:var(--surface-2);border-color:var(--ink)}
.dd-m{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:270px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(19,41,75,.18);padding:8px;display:flex;flex-direction:column}
.dd-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.dd-i{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer}
.dd-i:hover:not([disabled]){background:var(--surface-2)}.dd-i[disabled]{opacity:.4;cursor:not-allowed}
.opager{margin-left:auto;display:flex;align-items:center;gap:10px}
.osel-bar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--info) 10%,var(--surface));border-bottom:1px solid var(--line);font-size:14px}
.osel-bar .btn{margin-left:auto}
.otable th{vertical-align:bottom}.th2{font-size:10px;letter-spacing:.04em;text-transform:none;color:var(--info);font-weight:600;margin-top:2px}
.otable td{vertical-align:top;padding-top:13px;padding-bottom:13px}
.otable .ock{width:34px;padding-right:0;cursor:pointer}.otable .ost{width:30px;padding-left:4px;padding-right:0}
.otable input[type=checkbox]{width:17px;height:17px;accent-color:var(--navy);cursor:pointer}
.ostar{border:0;background:none;padding:0;cursor:pointer;color:color-mix(in srgb,var(--muted) 70%,transparent);display:inline-flex}
.ostar:hover{color:var(--warn)}.ostar.on{color:var(--warn)}.ostar.on svg{fill:currentColor}
.onum{font-weight:800;color:var(--info);font-size:15px}
.oitems{min-width:220px;max-width:420px}
.obadge{--c:var(--grey);display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:6px;background:var(--c);color:#fff;white-space:nowrap}
.oship{color:var(--info);margin-top:4px;max-width:220px}
.oicons{white-space:nowrap}.oicons > *{vertical-align:middle;margin-right:4px}
.oic{--c:var(--grey);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--c);color:#fff;font-size:11px;font-weight:800}
.odate{white-space:nowrap}.olink{color:var(--info);margin-top:3px}
tr.orow.sel td{background:color-mix(in srgb,var(--info) 8%,var(--surface))}
tr.orow.open td{background:var(--surface-2);border-bottom-color:transparent}
tr.oexp td{padding:0 14px 16px;background:var(--surface-2);cursor:default}tr.oexp:hover td{background:var(--surface-2)}
tr.oexp .opanel{box-shadow:none;border:1px solid var(--line)}

.opanels{display:grid;gap:16px}.opanel{overflow:hidden}.opanel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:16px}.opanel .modal-b{grid-template-columns:repeat(4,1fr)}.opanel .f.full{grid-column:1/-1}
@media (max-width:1100px){.opanel .modal-b{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.opanel .modal-b{grid-template-columns:1fr}}
.calc{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent-2) 10%,var(--surface-2));font-size:14px}

.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--navy);color:#fff;padding:12px 16px 14px 46px;border-radius:12px;font-weight:600;box-shadow:inset 0 -4px 0 var(--red),0 14px 34px rgba(7,18,38,.35);animation:toastIn .35s cubic-bezier(.2,.9,.2,1.15);max-width:360px;position:relative}
.toast::before{content:"";position:absolute;left:12px;top:50%;width:24px;height:24px;margin-top:-13px;background:url(assets/brand/icon.svg) center/contain no-repeat;border-radius:6px;box-shadow:0 0 0 1.5px rgba(255,255,255,.3)}
@keyframes toastIn{from{transform:translateX(30px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
[hidden]{display:none!important}
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(60% 50% at 85% 10%,color-mix(in srgb,var(--accent) 18%,transparent) 0,transparent 70%),
  radial-gradient(55% 50% at 10% 95%,color-mix(in srgb,var(--accent-2) 16%,transparent) 0,transparent 70%),var(--bg)}
.gcard{width:min(410px,100%);padding:30px 28px;display:flex;flex-direction:column;gap:16px}
.gcard h1{font-size:28px;font-weight:800}
.gcard p{margin:0;color:var(--muted)}
.gcard form{display:flex;flex-direction:column;gap:12px}
.gcard .btn.primary{justify-content:center;padding:12px}
.gmsg{font-size:14px;padding:10px 12px;border-radius:10px}
.gmsg.err{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.gmsg.ok{background:color-mix(in srgb,var(--good) 12%,var(--surface));color:var(--good)}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0;font-size:14px;align-self:center}
.gfoot{font-size:12px;color:var(--muted);text-align:center}
code{font-size:13px;background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash2{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px 14px;z-index:20;gap:10px;overflow:visible}
  .side::after{top:auto;left:0;width:auto;height:6px;background:var(--ribbon)}
  .side-tag{display:none}
  .brand{flex:none}.brand img{max-width:44px;height:44px;object-fit:cover;object-position:left}
  .nav button[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:-2px;width:auto;height:4px;border-radius:2px}
  .brand small,.side-foot .btn span{display:none}
  .side{flex-wrap:wrap;min-width:0;max-width:100vw}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3;min-width:0;scrollbar-width:none;padding-bottom:4px}
  .nav-group{flex-direction:row;align-items:center;flex:none}
  .nav-sub{flex-direction:row;margin:0;padding:0;gap:3px}
  .nav-group[data-open="true"] > .nav-sub{display:flex}
  .side-foot{margin-left:auto!important;min-width:0}
  .side-foot .btn{padding:7px 9px}
  .nav .count{display:none}
  .side-foot{margin:0;flex-direction:row}
  .me label{display:none}
  .team,.two{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero .ring{display:none}
}
@media (max-width:520px){
  .kpis{grid-template-columns:1fr 1fr}.kpi .val{font-size:23px}
  .modal-b{grid-template-columns:1fr}
  .nav button span{display:none}
}

function stripId(r){ const o = {...r}; delete o.id; return o; }
function rebuildAct(){ S.activity = Object.values(S.activityAll).sort((a,b)=>num(b.ts)-num(a.ts)).slice(0,30); }
function applyRow(r){
  if(!r || !r.col) return;
  if(r.col === "config"){ if(r.id === "main") S.settings = r.data || null; return; }
  if(r.col === "activity"){ S.activityAll[r.id] = {...(r.data||{}), id:r.id}; rebuildAct(); return; }
  if(S[r.col]) S[r.col][r.id] = {...(r.data||{}), id:r.id};
}
function removeRow(r){
  if(!r || !r.col) return;
  if(r.col === "activity"){ delete S.activityAll[r.id]; rebuildAct(); return; }
  if(S[r.col]) delete S[r.col][r.id];
}
const nowIso = () => new Date().toISOString();
async function put(col, id, data){
  const body = stripId({...data, updatedAt: Date.now()});
  const { error } = await SB.from("records").upsert({ col, id, data: body, updated_at: nowIso() });
  if(error) return handleErr(error);
  applyRow({col, id, data: body}); scheduleRender(); return true;
}
async function del(col, id){
  const { error } = await SB.from("records").delete().eq("col", col).eq("id", id);
  if(error) return handleErr(error);
  removeRow({col, id}); scheduleRender(); return true;
}
async function putSettings(patch){

  const { error } = await SB.from("records").upsert({ col:"config", id:"main", data: next, updated_at: nowIso() });
  if(error){ handleErr(error); return; }

}
function handleErr(e){

  else if(/JWT|session/i.test(m)) { toast("Sesja wygasła — zaloguj się ponownie."); setTimeout(()=>location.reload(), 1500); }
  else toast("Nie udało się zapisać. Sprawdź połączenie i spróbuj ponownie.");

}

async function loadAll(){
  const rows = []; let from = 0;
  for(;;){
    const { data, error } = await SB.from("records").select("col,id,data").order("col").order("id").range(from, from+999);
    if(error) throw error;
    rows.push(...data); if(data.length < 1000) break; from += 1000;
  }
  COLS.forEach(c => S[c] = {}); S.activityAll = {}; S.settings = null;
  rows.forEach(applyRow);
  const acts = Object.values(S.activityAll).sort((a,b)=>num(b.ts)-num(a.ts));
  if(acts.length > 300){ const old = acts.slice(300).map(a=>a.id).slice(0,500); SB.from("records").delete().eq("col","activity").in("id", old).then(()=>{}, ()=>{}); }
}

}

async function doNewPass(f){
  const p = f.password.value, p2 = f.password2.value;
  if(p.length < 8) return gateErr("Hasło musi mieć co najmniej 8 znaków.");
  if(p !== p2) return gateErr("Hasła się różnią.");
  busy(f, true);
  const { error } = await SB.auth.updateUser({ password: p });

const VIEWS = [
  ["pulpit","Pulpit","home"],["zamowienia","Zamówienia","orders"],
  ["dostawcy","Dostawcy","suppliers"],["klienci","Klienci","customers"],["zadania","Zadania","tasks"],["sklepy-i-boty","Sklepy i boty","bot"]
];
const view = () => { const h = location.hash.slice(1).split("/")[0]; return VIEWS.some(v=>v[0]===h) ? h : "pulpit"; };
const NAV_GROUPS = [
  { id: "zamowienia", label: "Zamówienia", icon: "orders", children: ["zamowienia", "klienci", "dostawcy", "leady"] },
  { id: "produkty", label: "Produkty", icon: "products", children: ["baza-produktow", "aukcje", "import-wtyczki", "eksport", "generator"] }
];
function navGroupOpen(id, childActive){
  if (childActive) return true;
  return ls.get("nhp-nav-" + id, "1") !== "0";
}
function navItemHtml(item, active, badge){
  if (!item) return "";
  const [k, l0, i] = item; const l = k === "zamowienia" ? "Wszystkie zamówienia" : l0;
  return `<button type="button" data-nav="${k}" ${k === active ? 'aria-current="page"' : ""}>${ic(i)}<span>${esc(l)}</span>${badge[k] ? `<span class="count num">${badge[k]}</span>` : ""}</button>`;
}
function navHtml(active, badge){
  const byKey = Object.fromEntries(VIEWS.map((v) => [v[0], v]));
  const grouped = new Set(NAV_GROUPS.flatMap((g) => g.children));
  const placed = new Set();
  const parts = [];
  for (const item of VIEWS) {
    const key = item[0];
    const group = NAV_GROUPS.find((g) => g.children.includes(key));
    if (group) {
      if (placed.has(group.id)) continue;
      placed.add(group.id);
      const childOn = group.children.includes(active);
      const open = navGroupOpen(group.id, childOn);
      const hiddenCount = group.children.reduce((sum, id) => sum + (badge[id] || 0), 0);
      const kids = group.children.map((id) => navItemHtml(byKey[id], active, badge)).join("");
      parts.push(`<div class="nav-group${childOn ? " is-on" : ""}" data-open="${open ? "true" : "false"}">
        <button type="button" class="nav-toggle" data-nav-group="${group.id}" aria-expanded="${open ? "true" : "false"}">${ic(group.icon)}<span>${esc(group.label)}</span><span class="nav-end">${!open && hiddenCount ? `<span class="count num">${hiddenCount}</span>` : ""}<i class="nav-chev" aria-hidden="true"></i></span></button>
        <div class="nav-sub">${kids}</div>
      </div>`);
      continue;
    }
    if (!grouped.has(key)) parts.push(navItemHtml(item, active, badge));
  }
  return parts.join("");
}

function ring(p){

function profitChart(){
  const days = []; const now = new Date();
  for(let i=13;i>=0;i--){ const d = new Date(now); d.setDate(d.getDate()-i); days.push(iso(d)); }
  const vals = days.map(day => arr("orders").filter(o => o.date===day && counts(o)).reduce((s,o)=>s+profitOf(o),0));
  const max = Math.max(100, ...vals.map(v=>Math.abs(v)));
  const W=560,H=150,pl=8,pb=22,pt=18, bw=(W-pl*2)/days.length;
  const y0 = H-pb, sc = (H-pb-pt)/max;
  let g = "";
  [0.5,1].forEach(f => { const y = y0 - max*f*sc; g += `<line x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl}" y="${y-4}">${fmtZl(max*f)}</text>`; });
  g += `<line x1="${pl}" x2="${W-pl}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>`;
  vals.forEach((v,i) => {
    const hgt = Math.max(v!==0?2:0, Math.abs(v)*sc), x = pl + i*bw + bw*.18, w = bw*.64;
    const last = i === vals.length-1;
    const fill = v < 0 ? "var(--bad)" : last ? "var(--accent)" : "var(--accent-2)";
    const y = v >= 0 ? y0 - hgt : y0;
    g += `<rect x="${x}" y="${y}" width="${w}" height="${Math.min(hgt, v<0?pb-4:hgt)}" rx="4" fill="${fill}" opacity="${last?1:.75}"><title>${fmtDate(days[i])}: ${fmtZl(v)}</title></rect>`;
  });
  const lastV = vals[vals.length-1];
  if(lastV > 0){ const x = pl + (vals.length-1)*bw + bw/2; g += `<text x="${x}" y="${y0 - lastV*sc - 5}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fmtZl(lastV)}</text>`; }
  g += `<text x="${pl}" y="${H-5}">${fmtDate(days[0])}</text><text x="${W-pl}" y="${H-5}" text-anchor="end">dziś</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Zysk z ostatnich 14 dni">${g}</svg>`;
}

    const cards = items.map(x => { const late = x.status!=="done" && x.due && x.due < t; const pc = opt(PRIO,x.prio)[2];
      return `<div class="task ${k==="done"?"done-t":""}" draggable="true" data-task="${x.id}" data-edit="tasks:${x.id}" style="--c:${pc}" tabindex="0">

        <div class="meta">${avatar(x.owner,22)}${x.due?`<span class="${late?"late":""}">${late?"po terminie · ":""}${fmtDate(x.due)}</span>`:""}
          <span class="mv" data-stop="1">${idx>0?`<button data-move="${x.id}:${TASK_ST[idx-1][0]}" aria-label="Przesuń w lewo">‹</button>`:""}${idx<2?`<button data-move="${x.id}:${TASK_ST[idx+1][0]}" aria-label="Przesuń w prawo">›</button>`:""}</span></div></div>`; }).join("");

  return topbar("Zadania", `${doneWeek ? `W tym tygodniu odhaczyliście już ${doneWeek}. Tak trzymać!` : "Przeciągaj karty między kolumnami albo użyj strzałek."}`, newBtn("tasks","Nowe zadanie")) +
    `<div class="chips" style="margin-bottom:14px">${chips}</div><div class="kanban">${cols}</div>`;

function wireDnD(){
  document.querySelectorAll(".task").forEach(el => {
    el.addEventListener("dragstart", e => { el.classList.add("dragging"); e.dataTransfer.setData("text/plain", el.dataset.task); e.dataTransfer.effectAllowed = "move"; });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over"); const id = e.dataTransfer.getData("text/plain"); if(id) moveTask(id, col.dataset.col); });
  });
}
async function moveTask(id, status){
  const x = S.tasks[id]; if(!x || x.status === status) return;
  const next = {...x, status, doneAt: status==="done" ? Date.now() : null};
  if(await put("tasks", id, next)){
    if(status==="done"){ celebrate(); toast(cheer(x.owner)); logAct(`Zrobione: ${x.title}`); }
    else logAct(`${x.title} → ${opt(TASK_ST,status)[1]}`);
  }
}
function cheer(k){ const n = pname(k); const opts = ["Brawo","Super robota","Pięknie","Odhaczone"]; const w = opts[Math.floor(Math.random()*opts.length)]; return n.toLowerCase()==="ja" || !k ? `${w}! Jedno mniej na liście.` : `${w}, ${n}! Jedno mniej na liście.`; }

function field(f, r, pfx="f-"){
  const v = r[f.k] ?? "";
  const id = pfx + f.k;
  const wrap = (inner) => `<div class="f ${f.full?"full":""}"><label for="${id}">${f.l}</label>${inner}</div>`;
  switch(f.t){
    case "calc": return `<div class="calc" id="calc"></div>`;
    case "textarea": return wrap(`<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`);
    case "number": return wrap(`<input id="${id}" name="${f.k}" inputmode="decimal" value="${esc(v)}">`);
    case "date": return wrap(`<input id="${id}" name="${f.k}" type="date" value="${esc(v)}">`);
    case "select": return wrap(`<select id="${id}" name="${f.k}">${f.opts.map(([k,l]) => `<option value="${esc(k)}" ${String(v)===k?"selected":""}>${esc(l)}</option>`).join("")}</select>`);
    case "person": return wrap(`<select id="${id}" name="${f.k}"><option value="">— nikt —</option>${team().map(p => `<option value="${p.k}" ${v===p.k?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`);
    case "ref": { const items = arr(f.ref).sort((a,b)=>String(a.name).localeCompare(String(b.name),"pl"));
      return wrap(`<select id="${id}" name="${f.k}"><option value="">— wybierz —</option>${items.map(x => `<option value="${esc(x.id)}" ${v===x.id?"selected":""}>${esc(x.name||x.id)}</option>`).join("")}</select>${items.length?"":`<span class="small muted">Najpierw dodaj: ${SCHEMA[f.ref].one}</span>`}`); }
    default: return wrap(`<input id="${id}" name="${f.k}" value="${esc(v)}" autocomplete="off">`);
  }
}
/* wartość produktu × ilość + wysyłka od klienta = kwota wpłacona (dopóki ktoś nie wpisze jej ręcznie) */
function orderAutofill(frm, changed){
  const E = n => frm.elements[n]; const p = byId("products", E("productId") && E("productId").value);
  const q = num(E("qty") && E("qty").value) || 1, sp = num(E("ship_paid") && E("ship_paid").value);
  if(p && E("cost") && (!E("cost").value || E("cost").dataset.auto)){ E("cost").value = Math.round(num(p.cost)*q*100)/100 || ""; E("cost").dataset.auto = "1"; }
  if(p && changed==="productId" && E("shipping") && !E("shipping").value && num(p.shipping)) E("shipping").value = num(p.shipping);
  const pr = E("price"); if(!pr) return;
  if(p && (!pr.value || pr.dataset.auto)){ pr.value = Math.round((num(p.price)*q + sp)*100)/100; pr.dataset.auto = "1"; }
}
function updCalc(){
  const g = k => num(($("#f-"+k)||{}).value);
  const p = g("price"), pr = p - g("cost") - g("shipping") - g("ads");
  const m = p ? pr/p*100 : 0;
  const el = $("#calc"); if(!el) return;
  el.innerHTML = `<span>Klient zapłacił: <b class="num">${fmtZl2(p)}</b>${g("ship_paid")?` <span class="muted">(w tym wysyłka ${fmtZl2(g("ship_paid"))})</span>`:""}</span><span>Zysk: <b class="num ${pr>=0?"pos":"neg"}">${fmtZl(pr)}</b></span><span>Marża: <b class="num">${m.toFixed(1).replace(".",",")}%</b></span><span class="muted">${pr>0 && m>=30 ? "Ładnie!" : pr>0 ? "Na plusie, ale marża mogłaby być wyższa." : "Na minusie — sprawdź koszty."}</span>`;
}
async function submitForm(){
  const {col, id, isNew, prev} = modalCtx;
  const fd = new FormData($("#frm"));
  const data = {...(prev||{})};
  SCHEMA[col].fields.forEach(f => { if(f.t === "calc") return; let v = fd.get(f.k); v = v == null ? "" : String(v).trim(); data[f.k] = f.t === "number" ? (v === "" ? "" : num(v)) : v; });
  const req = {orders:"number",products:"name",suppliers:"name",customers:"name",tasks:"title",shops:"name",bots:"name"}[col];
  if(!data[req]){ const el = $("#f-"+req); if(el){ el.focus(); el.setCustomValidity("Uzupełnij to pole"); el.reportValidity(); setTimeout(()=>el.setCustomValidity(""),1500); } return; }
  if(isNew) data.createdAt = Date.now();
  if(col==="orders" && (isNew || (prev && prev.status!==data.status))) data.statusAt = Date.now();
  if(col==="tasks"){ if(data.status==="done" && (!prev || prev.status!=="done")) data.doneAt = Date.now(); if(data.status!=="done") data.doneAt = null; }
  const okk = await put(col, id, data);
  if(!okk) return;
  closeModal();
  const label = data.name || data.title || ("#" + data.number);
  if(isNew){
    logAct(`Nowe: ${SCHEMA[col].one} ${label}`);
    if(col==="orders"){ setTimeout(()=>{ location.hash = "zamowienia/" + encodeURIComponent(id); }, 50); celebrate(.6); toast(`Nowe zamówienie #${data.number}! ${profitOf(data)>0?`+${fmtZl(profitOf(data))} zysku`:""}`); }
    else toast(`Dodano: ${label}`);
  } else {
    if(col==="orders" && prev && prev.status!==data.status) afterOrderStatus(data, prev.status);
    else if(col==="tasks" && data.status==="done" && prev.status!=="done"){ celebrate(); toast(cheer(data.owner)); logAct(`Zrobione: ${label}`); }
    else { logAct(`Zmiana: ${label}`); toast("Zapisano"); }
  }
}
function afterOrderStatus(o, old){
  logAct(`Zamówienie #${o.number} → ${opt(ORDER_ST,o.status)[1]}`);
  if(o.status==="wyslane") toast(`#${o.number} w drodze. Klient czeka z niecierpliwością!`);
  else if(o.status==="problem") toast(`Oznaczono problem przy #${o.number}. Ogarniemy to!`);
  else if(o.status==="zamowione") toast(`#${o.number} w realizacji.`);

async function quickStatus(col, id, status){

}

function celebrate(power=1){
  if(window.NHP_BRAND) NHP_BRAND.sound("win");

  const cv = $("#fx"), ctx = cv.getContext("2d"); const W = cv.width = innerWidth, H = cv.height = innerHeight;

  const P = Array.from({length: Math.round(110*power)}, () => ({x: W/2 + (Math.random()-.5)*W*.3, y: H*.35, vx:(Math.random()-.5)*14, vy: -Math.random()*12-4, r: Math.random()*6+4, c: cols[Math.floor(Math.random()*cols.length)], a: Math.random()*6, s:(Math.random()-.5)*.3}));
  let f = 0;

  })();
}

async function saveOrder(id, next, msg){
  const prev = S.orders[id]; if(!prev) return false;
  if(prev.status !== next.status) next.statusAt = Date.now();
  if(!(await put("orders", id, next))) return false;
  if(prev.status !== next.status) afterOrderStatus(next, prev.status); else if(msg){ toast(msg); logAct(`Zmiana: #${next.number}`); }
  return true;
}
function setItems(o, items){
  const next = {...o, items};
  next.cost = Math.round((num(o.cost) - catCost(itemsOf(o)) + catCost(items))*100)/100 || "";
  next.productId = items[0] ? (items[0].productId || "") : ""; next.qty = items[0] ? (num(items[0].qty)||1) : "";
  return next;
}
async function submitSection(frm){
  const [id] = frm.dataset.oid.split(":"), sec = frm.dataset.sec, o = S.orders[id]; if(!o) return;
  const fd = new FormData(frm);
  let next;
  if(sec === "items"){
    const items = itemsOf(o).map((x, i) => ({...x, qty: Math.max(1, num(fd.get("qty_"+i)) || 1), price: num(fd.get("price_"+i)), ...(x.productId ? {} : {name: String(fd.get("name_"+i)||"").trim() || "Pozycja"})}));
    next = setItems(o, items);
  } else {
    next = JSON.parse(JSON.stringify(o));
    OSECS[sec].forEach(([k,,t]) => { let v = fd.get(k); v = v == null ? "" : String(v).trim(); if(t==="number") v = v==="" ? "" : num(v);
      const path = k.split("."); let tgt = next; path.slice(0,-1).forEach(p => { tgt[p] = tgt[p] && typeof tgt[p]==="object" ? tgt[p] : {}; tgt = tgt[p]; }); tgt[path.at(-1)] = v; });
  }
  delete frm.dataset.dirty; UI.osec = null;
  if(!(await saveOrder(id, next, "Zapisano"))) { UI.osec = sec; render(); }
}

  saveOrder(id, setItems(o, items), `Dodano: ${p.name}`);
});

/* ---------- zamówienia: zaznaczanie i akcje zbiorcze ---------- */
function oselDo(what){
  const page = OPAGE.map(id=>S.orders[id]).filter(Boolean), vis = OVIS.map(id=>S.orders[id]).filter(Boolean);
  const src = what.startsWith("page") ? page : vis, k = what.replace(/^page-?/,"") || "all";
  if(k==="all") src.forEach(o=>OSEL.add(o.id));
  else if(k==="star") src.filter(o=>o.starred).forEach(o=>OSEL.add(o.id));
  else if(k==="none") src.forEach(o=>OSEL.delete(o.id));
  else if(k==="unstar") src.filter(o=>o.starred).forEach(o=>OSEL.delete(o.id));
  if(what==="none") OSEL.clear();
  render();
}
async function obulk(cmd){
  const ids = [...OSEL].filter(id=>S.orders[id]); if(!ids.length){ toast("Najpierw zaznacz zamówienia."); return; }
  const [k, v] = cmd.split(":");
  if(k==="print") return oprint(ids);
  if(k==="csv") return ocsv(ids);
  if(k==="del"){
    const b = document.querySelector('[data-obulk="del"]');
    if(b && !b.dataset.sure){ b.dataset.sure = "1"; b.classList.add("sure"); b.innerHTML = `${ic("trash",18)}<span>Usunąć ${ids.length}?</span>`; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.sure; b.classList.remove("sure"); b.innerHTML = ic("trash",18); } }, 4000); return; }
    let n = 0; for(const id of ids){ if(await del("orders", id)){ n++; OSEL.delete(id); } }
    toast(`Usunięto ${n} ${n===1?"zamówienie":n<5?"zamówienia":"zamówień"}`); logAct(`Usunięto ${n} zamówień`); return;
  }
  let n = 0;
  for(const id of ids){
    const r = S.orders[id]; const next = {...r};
    if(k==="status"){ if(ost(r)===v) continue; next.status = v; next.statusAt = Date.now(); }
    else if(k==="owner"){ if(r.owner===v) continue; next.owner = v; }
    else if(k==="star"){ const on = v==="1"; if(!!r.starred===on) continue; next.starred = on; }
    if(await put("orders", id, next)) n++;
  }
  const what = k==="status" ? `→ ${opt(ORDER_ST,v)[1]}` : k==="owner" ? `→ ${pname(v)}` : v==="1" ? "oznaczone gwiazdką" : "bez gwiazdki";
  if(n){ toast(`${n} ${n===1?"zamówienie":n<5?"zamówienia":"zamówień"} ${what}`); if(k!=="star") logAct(`Zbiorczo ${n} zamówień ${what}`); } else toast("Nic do zmiany");
}
function orowsFor(ids){ return ids.map(id=>S.orders[id]).filter(Boolean).map(o => ({nr:o.number||"", data:o.date||"", klient:custName(o), produkt:itemsOf(o).map(x=>`${num(x.qty)||1}x ${itemName(x)}`).join(", "), ilosc:itemsOf(o).reduce((s,x)=>s+(num(x.qty)||1),0)||1, kwota:num(o.price), wysylka_klient:shipPaidOf(o), zysk:profitOf(o), status:opt(ORDER_ST,ost(o))[1], platnosc:o.payment_status?opt(PAY_ST,o.payment_status)[1]:"", przewoznik:o.carrier||"", przesylka:o.tracking||"", adres:addrLine(o.delivery)||o.ship_to||"", email:o.buyer_email||"", telefon:o.buyer_phone||"", opiekun:pname(o.owner), notatki:o.notes||""})); }
function ocsv(ids){
  const rows = orowsFor(ids); const cols = Object.keys(rows[0]);
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = "﻿" + [cols.join(";"), ...rows.map(r=>cols.map(c=>q(r[c])).join(";"))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download = `zamowienia-${TODAY()}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast(`Pobrano CSV: ${rows.length} zamówień`);
}
function oprint(ids){
  const rows = orowsFor(ids);
  const w = window.open("", "_blank"); if(!w){ toast("Przeglądarka zablokowała okno drukowania."); return; }
  w.document.write(`<!doctype html><meta charset="utf-8"><title>Zamówienia ${TODAY()}</title><style>body{font:13px/1.4 system-ui,sans-serif;margin:24px;color:#13294B}h1{font-size:18px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#555}td.r{text-align:right}</style><h1>Zamówienia (${rows.length}) · ${new Date().toLocaleString("pl-PL")}</h1><table><tr><th>Nr</th><th>Data</th><th>Klient</th><th>Produkt</th><th>Szt.</th><th>Kwota (z wysyłką)</th><th>Status</th><th>Wysyłka</th></tr>${rows.map(r=>`<tr><td>${esc(r.nr)}</td><td>${esc(r.data)}</td><td>${esc(r.klient)}<br><small>${esc(r.telefon||r.email)}</small></td><td>${esc(r.produkt)}</td><td>${r.ilosc}</td><td class="r">${esc(fmtZl2(r.kwota))}${r.wysylka_klient?`<br><small>w tym wysyłka ${esc(fmtZl2(r.wysylka_klient))}</small>`:""}</td><td>${esc(r.status)}</td><td>${esc([r.przewoznik,r.przesylka,r.adres].filter(Boolean).join(" · "))}</td></tr>`).join("")}</table>`);
  w.document.close(); w.focus(); setTimeout(()=>w.print(), 200);
}
document.addEventListener("click", e => {
  // zamknij otwarte menu po kliknięciu poza nim albo po wyborze pozycji
  document.querySelectorAll("details.dd[open]").forEach(d => { if(!d.contains(e.target) || e.target.closest(".dd-i")) d.removeAttribute("open"); });
  const t = e.target;
  const sd = t.closest("[data-osel-do]"); if(sd){ oselDo(sd.dataset.oselDo); return; }
  const bk = t.closest("[data-obulk]"); if(bk){ if(!bk.disabled) obulk(bk.dataset.obulk); return; }
  const st = t.closest("[data-ostar]"); if(st){ const r = S.orders[st.dataset.ostar]; if(r) put("orders", r.id, {...r, starred: !r.starred}); return; }
  if(t.closest("[data-ostaronly]")){ UI.ostarOnly = !UI.ostarOnly; UI.opage = 1; render(); return; }
  const pg = t.closest("[data-opage]"); if(pg){ UI.opage += num(pg.dataset.opage); render(); $("#main").scrollTop = 0; return; }
  if(t.closest("[data-osort]")){ UI.osort = UI.osort==="asc" ? "desc" : "asc"; UI.opage = 1; render(); return; }
  if(t.closest("[data-ock]")){ const cb = t.closest("[data-ock]").querySelector("input"); if(t !== cb){ cb.click(); } return; }
  const row = t.closest("tr[data-orow]");
  if(row && !t.closest("[data-stop],a,button,input,select")){ location.hash = "zamowienia/" + encodeURIComponent(row.dataset.orow); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.osel){ t.checked ? OSEL.add(t.dataset.osel) : OSEL.delete(t.dataset.osel); render(); return; }
  if(t.matches("[data-osel-page]")){ OPAGE.forEach(id => t.checked ? OSEL.add(id) : OSEL.delete(id)); render(); return; }
  if(t.matches("[data-oper]")){ UI.oper = num(t.value) || 20; UI.opage = 1; render(); return; }
});

const VIEW_FNS = { pulpit:vDash, zamowienia:vOrders, produkty:vProducts, dostawcy:vSuppliers, klienci:vCustomers, zadania:vTasks, "sklepy-i-boty":vShops };
const CRM = {
  $, esc, num, fmtZl, uid, toast, openModal, closeModal, put, del, arr, byId, nameOf,
  logAct, scheduleRender, team, avatar, pill, ic, TODAY, SCHEMA, COLS, VIEWS, VIEW_FNS, DEFAULTS, S, UI,
  opt, ORDER_ST, PAY_ST, badgeFns, readyFns,
  get SB(){ return SB; },
  get me(){ return me; },
  get sessionEmail(){ return sessionEmail; },
  async reload(){
    await loadAll();
    for (const fn of readyFns) { try { await fn(); } catch (e) { console.error(e); } }
    scheduleRender();
  }
};
window.CRM_API = CRM;
(window.NHP_HOOKS || []).forEach((fn) => { try { fn(CRM); } catch (e) { console.error(e); } });
boot();
})();
