<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Centrala CRM · Nowoczesny Handel Polski</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23FF6B2C%22/%3E%3Cpath d=%22M26 11 16 6 6 11v10l10 5 10-5Z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.4%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: "taśma pakowa i zielone światło" — chłodne, czyste tło, pomarańcz taśmy jako akcent, morska zieleń jako drugi akcent; kolory wspólników.
   Layout: boczna nawigacja + robocza kolumna; pulpit = podsumowanie nad detalami. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F8F9FC; --ink:#161A2E; --muted:#646A82; --line:#E2E6EF;
  --accent:#FF6B2C; --accent-ink:#FFFFFF; --accent-2:#13A898;
  --good:#16A34A; --warn:#D99600; --bad:#E5484D; --info:#4C7EF3; --violet:#8B5CF6; --grey:#8A8FA3;
  --p1:#FF6B2C; --p2:#5B5BD6; --p3:#E93D82;
  --shadow:0 1px 2px rgba(22,26,46,.05),0 6px 20px rgba(22,26,46,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1020; --surface:#171A2D; --surface-2:#1C2036; --ink:#EEF0F8; --muted:#9AA0BA; --line:#2A2F4A;
    --accent:#FF7A42; --accent-ink:#1A0E06; --accent-2:#2CC4B2;
    --good:#34C26A; --warn:#F0B429; --bad:#F2676B; --info:#6E98FF; --violet:#A585FF; --grey:#9095AA;
    --p1:#FF7A42; --p2:#8183F2; --p3:#F06BA4;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1020; --surface:#171A2D; --surface-2:#1C2036; --ink:#EEF0F8; --muted:#9AA0BA; --line:#2A2F4A;
  --accent:#FF7A42; --accent-ink:#1A0E06; --accent-2:#2CC4B2;
  --good:#34C26A; --warn:#F0B429; --bad:#F2676B; --info:#6E98FF; --violet:#A585FF; --grey:#9095AA;
  --p1:#FF7A42; --p2:#8183F2; --p3:#F06BA4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-2)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-box{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);transform:rotate(-6deg)}
.brand b{font-family:var(--display);font-size:20px;font-weight:800;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;background:var(--surface-2);border:1px solid var(--line);padding:0 7px;border-radius:99px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.me label{font-size:12px;color:var(--muted);display:block}
.me select{border:0;background:transparent;font-weight:700;padding:0;cursor:pointer}

.main{padding:26px clamp(16px,3vw,36px) 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(26px,3vw,34px);font-weight:800}
.top p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:11px;font-weight:600;cursor:pointer;transition:transform .12s ease,background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.05);background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:13px;font-weight:600}
.kpi .val{font-family:var(--display);font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:2px}
.kpi::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--k,var(--accent))}
.dash2{grid-template-columns:1.55fr 1fr}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:18px;font-weight:700}
.sec-h .hint{color:var(--muted);font-size:13px}

.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:20px 22px;margin-bottom:16px;background:
  radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent) 0,transparent 55%),
  radial-gradient(100% 120% at 0% 100%,color-mix(in srgb,var(--accent-2) 12%,transparent) 0,transparent 60%),var(--surface)}
.hero .date{color:var(--muted);font-size:13px;font-weight:600}.hero .date::first-letter{text-transform:uppercase}
.hero h2{font-size:clamp(22px,2.4vw,28px);font-weight:800;margin-top:2px}
.hero .quote{margin-top:6px;color:var(--ink);opacity:.85}
.goal{margin-top:16px}
.goal-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:8px;flex-wrap:wrap}
.goal-top b{font-family:var(--display)}
.bar{height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.stage{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
.ring{width:96px;height:96px}

.pipe{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 12px}
.pipe i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.team{grid-template-columns:repeat(3,minmax(0,1fr))}
.mate{padding:16px;position:relative}
.mate .who{display:flex;align-items:center;gap:10px}
.mate .who b{font-size:16px}
.mate .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mate .stats div{background:var(--surface-2);border-radius:10px;padding:8px}
.mate .stats span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.mate .stats strong{font-family:var(--display);font-size:18px}
.star{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--warn);color:#1b1300;letter-spacing:.02em}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;flex:none;font-family:var(--display)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t small{display:block;color:var(--muted);font-size:12px}
.flag{width:4px;align-self:stretch;border-radius:4px;flex:none}
.empty{color:var(--muted);text-align:center;padding:26px 12px;font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;max-width:340px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px}
.search input{border:0;background:transparent;padding:9px 0;width:100%;outline:none}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th:first-child{border-top-left-radius:var(--r)}th:last-child{border-top-right-radius:var(--r)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.strong{font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.demo{border-style:dashed}
.pill{--c:var(--grey);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink));white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
select.pill{border:0;appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:12px}
select.pill::before{display:none}

.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcard{padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .15s ease,box-shadow .15s}
.pcard:hover{transform:translateY(-2px)}
.pcard h3{font-size:17px;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv div{background:var(--surface-2);border-radius:9px;padding:6px 8px}
.kv span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.kv strong{font-size:15px}
.mbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c,var(--good))}

.kanban{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:240px;transition:background .15s}
.col.over{background:color-mix(in srgb,var(--accent) 10%,var(--surface-2));border-color:var(--accent)}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700}
.col-h .n{margin-left:auto;color:var(--muted);font-size:13px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab;box-shadow:var(--shadow);border-left:4px solid var(--c,var(--line))}
.task.dragging{opacity:.5}
.task b{display:block;font-size:14px}
.task .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.task .late{color:var(--bad);font-weight:700}
.task .mv{margin-left:auto;display:flex;gap:4px}
.task .mv button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;width:26px;height:24px;cursor:pointer;color:var(--muted)}
.done-t b{text-decoration:line-through;opacity:.6}

.two{grid-template-columns:1fr 1fr}
.ent{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ent:hover{background:var(--surface-2)}
.ent + .ent{border-top:1px solid var(--line)}
.ent .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent))}
.ent .t{flex:1;min-width:0}
.ent .t small{display:block;color:var(--muted);font-size:13px}

.banner{padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:14px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 12%,var(--surface))}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.45);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:40;overflow-y:auto}
.scrim.open{display:flex}
.modal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:20px}
.modal-b{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal-f{display:flex;gap:10px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);border-color:var(--accent)}
.calc{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent-2) 10%,var(--surface-2));font-size:14px}

.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s ease;max-width:340px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
[hidden]{display:none!important}
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(60% 50% at 85% 10%,color-mix(in srgb,var(--accent) 18%,transparent) 0,transparent 70%),
  radial-gradient(55% 50% at 10% 95%,color-mix(in srgb,var(--accent-2) 16%,transparent) 0,transparent 70%),var(--bg)}
.gcard{width:min(410px,100%);padding:30px 28px;display:flex;flex-direction:column;gap:16px}
.gcard h1{font-size:28px;font-weight:800}
.gcard p{margin:0;color:var(--muted)}
.gcard form{display:flex;flex-direction:column;gap:12px}
.gcard .btn.primary{justify-content:center;padding:12px}
.gmsg{font-size:14px;padding:10px 12px;border-radius:10px}
.gmsg.err{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.gmsg.ok{background:color-mix(in srgb,var(--good) 12%,var(--surface));color:var(--good)}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0;font-size:14px;align-self:center}
.gfoot{font-size:12px;color:var(--muted);text-align:center}
code{font-size:13px;background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash2{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:20;gap:10px}
  .brand small,.side-foot .btn span{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1}
  .nav .count{display:none}
  .side-foot{margin:0;flex-direction:row}
  .me label{display:none}
  .team,.two{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero .ring{display:none}
}
@media (max-width:520px){
  .kpis{grid-template-columns:1fr 1fr}.kpi .val{font-size:23px}
  .modal-b{grid-template-columns:1fr}
  .nav button span{display:none}
  .brand b{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden></div>
<div class="app" hidden>
  <aside class="side">
    <div class="brand">
      <div class="brand-box" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg></div>
      <div><b>Centrala</b><small>CRM dropshipping</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sekcje"></nav>
    <div class="side-foot">
      <div class="me"><span id="meAv"></span><div><label for="meSel">Pracujesz jako</label><select id="meSel"></select></div></div>

  if(!d) return p === "all";

  const diff = daysBetween(d, TODAY()); return diff >= 0 && diff < num(p);

function applyRow(r){
  if(!r || !r.col) return;
  if(r.col === "config"){ if(r.id === "main") S.settings = r.data || null; return; }
  if(r.col === "activity"){ S.activityAll[r.id] = {...(r.data||{}), id:r.id}; rebuildAct(); return; }
  if(S[r.col]) S[r.col][r.id] = {...(r.data||{}), id:r.id};
}
function removeRow(r){
  if(!r || !r.col) return;
  if(r.col === "activity"){ delete S.activityAll[r.id]; rebuildAct(); return; }
  if(S[r.col]) delete S[r.col][r.id];
}
const nowIso = () => new Date().toISOString();
async function put(col, id, data){
  const body = stripId({...data, updatedAt: Date.now()});
  const { error } = await SB.from("records").upsert({ col, id, data: body, updated_at: nowIso() });
  if(error) return handleErr(error);
  applyRow({col, id, data: body}); scheduleRender(); return true;
}
async function del(col, id){
  const { error } = await SB.from("records").delete().eq("col", col).eq("id", id);
  if(error) return handleErr(error);
  removeRow({col, id}); scheduleRender(); return true;
}
async function putSettings(patch){
  const next = {...(S.settings||{}), ...patch};
  const { error } = await SB.from("records").upsert({ col:"config", id:"main", data: next, updated_at: nowIso() });
  if(error){ handleErr(error); return; }
  S.settings = next; scheduleRender();
}
function handleErr(e){
  console.error(e);
  const m = String((e && e.message) || "");
  if(/row-level security|permission|42501/i.test(m)) toast("Brak uprawnień do zapisu. Sprawdź, czy Twój e-mail jest na liście wspólników w Supabase.");
  else if(/JWT|session/i.test(m)) { toast("Sesja wygasła — zaloguj się ponownie."); setTimeout(()=>location.reload(), 1500); }
  else toast("Nie udało się zapisać. Sprawdź połączenie i spróbuj ponownie.");
  return false;
}
function logAct(text){
  const id = uid("ac"), a = {ts: Date.now(), who: me, text: String(text).slice(0,200)};
  applyRow({col:"activity", id, data:a});
  SB.from("records").insert({col:"activity", id, data:a}).then(()=>{}, ()=>{});
}
async function loadAll(){
  const rows = []; let from = 0;
  for(;;){
    const { data, error } = await SB.from("records").select("col,id,data").order("col").order("id").range(from, from+999);
    if(error) throw error;
    rows.push(...data); if(data.length < 1000) break; from += 1000;
  }
  COLS.forEach(c => S[c] = {}); S.activityAll = {}; S.settings = null;
  rows.forEach(applyRow);
  const acts = Object.values(S.activityAll).sort((a,b)=>num(b.ts)-num(a.ts));
  if(acts.length > 300){ const old = acts.slice(300).map(a=>a.id).slice(0,500); SB.from("records").delete().eq("col","activity").in("id", old).then(()=>{}, ()=>{}); }
}
function autoMe(){
  const em = (S.settings && S.settings.emails) || {};
  const k = Object.keys(em).find(k => em[k] && sessionEmail && em[k].trim().toLowerCase() === sessionEmail.toLowerCase());
  if(k){ me = k; ls.set("crm_me", me); }
}
async function startData(){
  mode = "loading"; render();

  try{ await loadAll(); loadNote = ""; mode = "live"; }
  catch(e){ console.error(e); loadNote = "Nie udało się wczytać danych. Odśwież stronę za chwilę. Jeśli to się powtarza, sprawdź, czy Twój e-mail jest na liście wspólników."; mode = "error"; }
  clearTimeout(timer);
  autoMe();
  for (const fn of readyFns) { try { await fn(); } catch (e) { console.error(e); } }
  if(!channel){
    channel = SB.channel("records-live")
      .on("postgres_changes", {event:"*", schema:"public", table:"records"}, p => { if(p.eventType === "DELETE") removeRow(p.old); else applyRow(p.new); scheduleRender(); })
      .subscribe();
  }
  render();
}
let rq = 0;
function scheduleRender(){ if(rq) return; rq = requestAnimationFrame(()=>{ rq = 0; render(); }); }
const readyFns = [];
const badgeFns = [];
function navBadges(){
  const openOrders = arr("orders").filter(o => ["nowe","zamowione","problem"].includes(o.status)).length;
  const openTasks = arr("tasks").filter(t => t.status !== "done" && t.owner === me).length;
  const badge = { zamowienia: openOrders, zadania: openTasks };
  for (const fn of badgeFns) { try { Object.assign(badge, fn() || {}); } catch (e) { console.error(e); } }
  return badge;
}

function showGate(kind, msg){ const g = $("#gate"); g.innerHTML = gateHtml(kind, msg); g.hidden = false; document.querySelector(".app").hidden = true; const f = g.querySelector("input"); if(f) f.focus(); }
function gateErr(t){ const el = $("#gMsg"); if(el){ el.className = "gmsg err"; el.textContent = t; el.hidden = false; } }
function busy(f, on){ const b = f.querySelector("button[type=submit]"); if(b){ b.disabled = on; b.style.opacity = on ? .6 : 1; } }
let entered = false;
function enter(sess){
  if(entered || !sess) return; entered = true;
  sessionEmail = (sess.user && sess.user.email) || "";
  $("#gate").hidden = true; document.querySelector(".app").hidden = false;
  if(/access_token|type=|error/.test(location.hash) || /code=/.test(location.search)) history.replaceState(null, "", location.pathname + "#pulpit");
  startData();
}
async function doLogin(f){
  if(!f.email.value.trim() || !f.password.value){ gateErr("Wpisz e-mail i hasło."); return; }
  busy(f, true);
  const { data, error } = await SB.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
  busy(f, false);
  if(error){ gateErr(/invalid/i.test(error.message) ? "Zły e-mail lub hasło." : /confirm/i.test(error.message) ? "To konto nie jest jeszcze potwierdzone. Kliknij link z maila zaproszenia." : "Nie udało się zalogować: " + error.message); return; }
  enter(data.session);
}
async function doForgot(f){
  busy(f, true);
  const { error } = await SB.auth.resetPasswordForEmail(f.email.value.trim(), { redirectTo: location.origin + location.pathname });
  busy(f, false);
  showGate("login", error ? {err: "Nie udało się wysłać maila: " + error.message} : {ok: "Jeśli ten e-mail jest w zespole, za chwilę dostaniesz link do ustawienia hasła."});
}
async function doNewPass(f){
  const p = f.password.value, p2 = f.password2.value;
  if(p.length < 8) return gateErr("Hasło musi mieć co najmniej 8 znaków.");
  if(p !== p2) return gateErr("Hasła się różnią.");
  busy(f, true);
  const { error } = await SB.auth.updateUser({ password: p });
  busy(f, false);
  if(error) return gateErr("Nie udało się ustawić hasła: " + error.message);
  const { data: { session } } = await SB.auth.getSession();
  toast("Hasło ustawione. Witaj w Centrali!");
  enter(session);
}
async function boot(){
  if (window.NHP_LOCAL && typeof window.NHP_LOCAL_CLIENT === "function") {
    SB = window.NHP_LOCAL_CLIENT();
    sessionEmail = "sandbox@local";
    entered = true;
    $("#gate").hidden = true;
    document.querySelector(".app").hidden = false;
    if (!location.hash) location.hash = "pulpit";
    startData();
    return;
  }
  if(!window.supabase || !CFG.url || !CFG.key || /WKLEJ/.test(CFG.url + CFG.key)){ showGate("setup"); return; }
  SB = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  SB.auth.onAuthStateChange((ev) => {
    if(ev === "PASSWORD_RECOVERY") showGate("newpass");
    if(ev === "SIGNED_OUT"){ location.hash = ""; location.reload(); }
  });
  const { data: { session } } = await SB.auth.getSession();
  if(LINK_ERR){ showGate("login", {err: /expired|invalid/i.test(LINK_ERR) ? "Link wygasł albo był już użyty. Poproś o nowy (Nie pamiętam hasła)." : LINK_ERR}); history.replaceState(null, "", location.pathname); return; }
  if(session && ["invite","recovery","signup","magiclink","email"].includes(LINK_TYPE)){ showGate("newpass"); return; }
  if(session) enter(session); else showGate("login");
}

  const st = S.settings || {};

  const goalNow = goalType === "revenue" ? monthLive.reduce((s,o)=>s+num(o.price),0) : monthLive.reduce((s,o)=>s+profitOf(o),0);
  const pct = Math.max(0, Math.min(100, goalNow/goal*100));
  const stage = pct >= 100 ? "Cel zdobyty!" : pct >= 75 ? "Finisz blisko" : pct >= 50 ? "Połowa za nami" : pct >= 25 ? "Rozpędzamy się" : "Rozgrzewka";
  const d = new Date();

       <div class="goal">

         <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%"></i></div>
         <div class="ticks"><span>0</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
         <p class="small muted" style="margin:8px 0 0">${pct>=100 ? "Brawo zespół! Wszystko ponad cel to bonus." : `Żeby dowieźć cel, potrzebujemy ok. <b class="num">${fmtZl(perDay)}</b> dziennie przez ${left+1} ${left+1===1?"dzień":"dni"}.`} <button class="btn ghost sm" data-act="settings">Zmień cel</button></p>
       </div>
     </div>
     ${ring(pct)}
   </section>
   <section class="grid kpis" style="margin-bottom:16px">
     ${kpi("Przychód", fmtZl(revenue), `${fmtN(live.length)} zamówień`, "var(--accent-2)")}
     ${kpi("Zysk na czysto", fmtZl(profit), "po koszcie towaru, wysyłki i reklam", profit>=0?"var(--good)":"var(--bad)")}
     ${kpi("Średnia marża", `${margin.toFixed(1).replace(".",",")}%`, margin>=30?"zdrowo":"warto podnieść ceny lub zbić koszty", margin>=30?"var(--good)":"var(--warn)")}
     ${kpi("Dostarczone", fmtN(delivered), `zwroty: ${orders.filter(o=>o.status==="zwrot").length}`, "var(--accent)")}

function kpi(l,v,s,c){ return `<div class="card kpi" style="--k:${c}"><div class="lbl">${l}</div><div class="val num">${v}</div><div class="sub">${s}</div></div>`; }
function ring(p){
  const r = 40, C = 2*Math.PI*r, off = C*(1-p/100);
  return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="var(--ink)">${Math.round(p)}%</text></svg>`;
}
function profitChart(){
  const days = []; const now = new Date();
  for(let i=13;i>=0;i--){ const d = new Date(now); d.setDate(d.getDate()-i); days.push(iso(d)); }
  const vals = days.map(day => arr("orders").filter(o => o.date===day && counts(o)).reduce((s,o)=>s+profitOf(o),0));
  const max = Math.max(100, ...vals.map(v=>Math.abs(v)));
  const W=560,H=150,pl=8,pb=22,pt=18, bw=(W-pl*2)/days.length;
  const y0 = H-pb, sc = (H-pb-pt)/max;
  let g = "";
  [0.5,1].forEach(f => { const y = y0 - max*f*sc; g += `<line x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl}" y="${y-4}">${fmtZl(max*f)}</text>`; });
  g += `<line x1="${pl}" x2="${W-pl}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>`;
  vals.forEach((v,i) => {
    const hgt = Math.max(v!==0?2:0, Math.abs(v)*sc), x = pl + i*bw + bw*.18, w = bw*.64;
    const last = i === vals.length-1;
    const fill = v < 0 ? "var(--bad)" : last ? "var(--accent)" : "var(--accent-2)";
    const y = v >= 0 ? y0 - hgt : y0;
    g += `<rect x="${x}" y="${y}" width="${w}" height="${Math.min(hgt, v<0?pb-4:hgt)}" rx="4" fill="${fill}" opacity="${last?1:.75}"><title>${fmtDate(days[i])}: ${fmtZl(v)}</title></rect>`;
  });
  const lastV = vals[vals.length-1];
  if(lastV > 0){ const x = pl + (vals.length-1)*bw + bw/2; g += `<text x="${x}" y="${y0 - lastV*sc - 5}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fmtZl(lastV)}</text>`; }
  g += `<text x="${pl}" y="${H-5}">${fmtDate(days[0])}</text><text x="${W-pl}" y="${H-5}" text-anchor="end">dziś</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Zysk z ostatnich 14 dni">${g}</svg>`;
}
function pipeline(orders){
  const n = orders.length || 1;
  const bar = ORDER_ST.map(([k,,c]) => { const c2 = orders.filter(o=>o.status===k).length; return c2 ? `<i style="width:${c2/n*100}%;background:${c}" title="${k}"></i>` : ""; }).join("");
  const chips = ORDER_ST.map(([k,l,c]) => `<button class="chip" data-goto-orders="${k}"><span class="dot" style="background:${c}"></span>${l} <span class="muted num">${orders.filter(o=>o.status===k).length}</span></button>`).join("");
  return `<div class="pipe">${orders.length?bar:`<i style="width:100%;background:var(--line)"></i>`}</div><div class="chips">${chips}</div>`;
}
function attention(){

  arr("orders").filter(o=>o.status==="problem").forEach(o => items.push({c:"var(--bad)", t:`Problem z zamówieniem #${o.number||"?"}`, s:`${nameOf("customers",o.customerId)} · ${nameOf("products",o.productId)}`, act:`data-edit="orders:${o.id}"`, who:o.owner}));

  arr("products").filter(p=>p.status!=="stop" && num(p.price)>0 && (num(p.price)-num(p.cost)-num(p.shipping))/num(p.price) < .3).forEach(p => items.push({c:"var(--violet)", t:`Niska marża: ${p.name}`, s:`${(((num(p.price)-num(p.cost)-num(p.shipping))/num(p.price))*100).toFixed(0)}% — sprawdź cenę`, act:`data-edit="products:${p.id}"`, who:p.owner}));

}
function teamCards(){
  const since = Date.now() - 7*864e5;
  const data = team().map(p => {
    const doneT = arr("tasks").filter(t=>t.owner===p.k && t.status==="done" && num(t.doneAt) >= since).length;
    const openT = arr("tasks").filter(t=>t.owner===p.k && t.status!=="done").length;
    const ords = arr("orders").filter(o=>o.owner===p.k && counts(o) && o.date && daysBetween(o.date,TODAY())<7);
    const prof = ords.reduce((s,o)=>s+profitOf(o),0);
    return {...p, doneT, openT, ords:ords.length, prof, score: doneT*2 + ords.length};
  });
  const best = data.reduce((a,b)=> b.score > a.score ? b : a, data[0]);
  return data.map(p => `<div class="card mate">${best.score>0 && p.k===best.k?`<span class="star">GWIAZDA TYGODNIA</span>`:""}
    <div class="who">${avatar(p.k,40)}<div><b>${esc(p.name)}</b><div class="small muted">${p.openT ? `${p.openT} otwartych zadań` : "brak otwartych zadań"}</div></div></div>

  </div>`).join("");
}

function ago(ts){ const m = Math.round((Date.now()-num(ts))/6e4); if(m<1) return "przed chwilą"; if(m<60) return `${m} min temu`; const h = Math.round(m/60); if(h<24) return `${h} godz. temu`; const d = Math.round(h/24); return d===1?"wczoraj":`${d} dni temu`; }

function wireDnD(){
  document.querySelectorAll(".task").forEach(el => {
    el.addEventListener("dragstart", e => { el.classList.add("dragging"); e.dataTransfer.setData("text/plain", el.dataset.task); e.dataTransfer.effectAllowed = "move"; });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => { e.preventDefault(); col.classList.remove("over"); const id = e.dataTransfer.getData("text/plain"); if(id) moveTask(id, col.dataset.col); });
  });
}
async function moveTask(id, status){
  const x = S.tasks[id]; if(!x || x.status === status) return;
  const next = {...x, status, doneAt: status==="done" ? Date.now() : null};
  if(await put("tasks", id, next)){
    if(status==="done"){ celebrate(); toast(cheer(x.owner)); logAct(`Zrobione: ${x.title}`); }
    else logAct(`${x.title} → ${opt(TASK_ST,status)[1]}`);
  }
}
function cheer(k){ const n = pname(k); const opts = ["Brawo","Super robota","Pięknie","Odhaczone"]; const w = opts[Math.floor(Math.random()*opts.length)]; return n.toLowerCase()==="ja" || !k ? `${w}! Jedno mniej na liście.` : `${w}, ${n}! Jedno mniej na liście.`; }

/* ---------- modal / forms ---------- */
let modalCtx = null;
function openModal(html){ $("#modal").innerHTML = html; $("#scrim").classList.add("open"); setTimeout(()=>{ const f = $("#modal").querySelector("input,select,textarea"); if(f) f.focus(); }, 30); }
function closeModal(){ $("#scrim").classList.remove("open"); $("#modal").innerHTML = ""; modalCtx = null; }

function nextOrderNo(){ const n = arr("orders").map(o=>parseInt(String(o.number).replace(/\D/g,""),10)).filter(isFinite); return String(n.length ? Math.max(...n)+1 : 1001); }

function openForm(col, id){
  const sc = SCHEMA[col]; const rec = id ? S[col][id] : null;
  const r = rec ? {...rec} : {...DEFAULTS[col], owner:me};
  if(!rec && col==="orders"){ r.number = nextOrderNo(); r.date = TODAY(); }
  if(!rec && col==="tasks"){ r.due = ""; }
  modalCtx = {col, id: id || uid(col.slice(0,2)), isNew: !rec, prev: rec};
  const fields = sc.fields.map(f => field(f, r)).join("");
  openModal(`<form id="frm" novalidate>
    <div class="modal-h"><h2 id="mTitle">${rec ? sc.title : "Nowe: " + sc.one}</h2><button type="button" class="btn ghost sm" data-act="close" aria-label="Zamknij">${ic("x",18)}</button></div>
    <div class="modal-b">${fields}</div>
    <div class="modal-f"><div>${rec?`<button type="button" class="btn danger" data-act="del">Usuń</button>`:""}</div><div class="row"><button type="button" class="btn" data-act="close">Anuluj</button><button type="submit" class="btn primary">${rec?"Zapisz zmiany":"Dodaj"}</button></div></div>
  </form>`);
  if(col==="orders") updCalc();
}
function field(f, r){
  const v = r[f.k] ?? "";
  const id = "f-" + f.k;
  const wrap = (inner) => `<div class="f ${f.full?"full":""}"><label for="${id}">${f.l}</label>${inner}</div>`;
  switch(f.t){
    case "calc": return `<div class="calc" id="calc"></div>`;
    case "textarea": return wrap(`<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`);
    case "number": return wrap(`<input id="${id}" name="${f.k}" inputmode="decimal" value="${esc(v)}">`);
    case "date": return wrap(`<input id="${id}" name="${f.k}" type="date" value="${esc(v)}">`);
    case "select": return wrap(`<select id="${id}" name="${f.k}">${f.opts.map(([k,l]) => `<option value="${esc(k)}" ${String(v)===k?"selected":""}>${esc(l)}</option>`).join("")}</select>`);
    case "person": return wrap(`<select id="${id}" name="${f.k}"><option value="">— nikt —</option>${team().map(p => `<option value="${p.k}" ${v===p.k?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`);
    case "ref": { const items = arr(f.ref).sort((a,b)=>String(a.name).localeCompare(String(b.name),"pl"));
      return wrap(`<select id="${id}" name="${f.k}"><option value="">— wybierz —</option>${items.map(x => `<option value="${esc(x.id)}" ${v===x.id?"selected":""}>${esc(x.name||x.id)}</option>`).join("")}</select>${items.length?"":`<span class="small muted">Najpierw dodaj: ${SCHEMA[f.ref].one}</span>`}`); }
    default: return wrap(`<input id="${id}" name="${f.k}" value="${esc(v)}" autocomplete="off">`);
  }
}
function updCalc(){
  const g = k => num(($("#f-"+k)||{}).value);
  const p = g("price"), pr = p - g("cost") - g("shipping") - g("ads");
  const m = p ? pr/p*100 : 0;
  const el = $("#calc"); if(!el) return;
  el.innerHTML = `<span>Zysk: <b class="num ${pr>=0?"pos":"neg"}">${fmtZl(pr)}</b></span><span>Marża: <b class="num">${m.toFixed(1).replace(".",",")}%</b></span><span class="muted">${pr>0 && m>=30 ? "Ładnie!" : pr>0 ? "Na plusie, ale marża mogłaby być wyższa." : "Na minusie — sprawdź koszty."}</span>`;
}
async function submitForm(){
  const {col, id, isNew, prev} = modalCtx;
  const fd = new FormData($("#frm"));
  const data = {...(prev||{})};
  SCHEMA[col].fields.forEach(f => { if(f.t === "calc") return; let v = fd.get(f.k); v = v == null ? "" : String(v).trim(); data[f.k] = f.t === "number" ? (v === "" ? "" : num(v)) : v; });
  const req = {orders:"number",products:"name",suppliers:"name",customers:"name",tasks:"title",shops:"name",bots:"name"}[col];
  if(!data[req]){ const el = $("#f-"+req); if(el){ el.focus(); el.setCustomValidity("Uzupełnij to pole"); el.reportValidity(); setTimeout(()=>el.setCustomValidity(""),1500); } return; }
  if(isNew) data.createdAt = Date.now();
  if(col==="tasks"){ if(data.status==="done" && (!prev || prev.status!=="done")) data.doneAt = Date.now(); if(data.status!=="done") data.doneAt = null; }
  if(col==="orders" && data.status==="dostarczone" && (!prev || prev.status!=="dostarczone")) data.deliveredAt = Date.now();
  const okk = await put(col, id, data);
  if(!okk) return;
  closeModal();
  const label = data.name || data.title || ("#" + data.number);
  if(isNew){
    logAct(`Nowe: ${SCHEMA[col].one} ${label}`);
    if(col==="orders"){ celebrate(.6); toast(`Nowe zamówienie #${data.number}! ${profitOf(data)>0?`+${fmtZl(profitOf(data))} zysku`:""}`); }
    else toast(`Dodano: ${label}`);
  } else {
    if(col==="orders" && prev && prev.status!==data.status) afterOrderStatus(data, prev.status);
    else if(col==="tasks" && data.status==="done" && prev.status!=="done"){ celebrate(); toast(cheer(data.owner)); logAct(`Zrobione: ${label}`); }
    else { logAct(`Zmiana: ${label}`); toast("Zapisano"); }
  }
}
function afterOrderStatus(o, old){
  logAct(`Zamówienie #${o.number} → ${opt(ORDER_ST,o.status)[1]}`);
  if(o.status==="dostarczone"){ celebrate(); toast(`Paczka #${o.number} u klienta! ${fmtZl(profitOf(o))} zysku w kieszeni.`); }
  else if(o.status==="wyslane") toast(`#${o.number} w drodze. Klient czeka z niecierpliwością!`);
  else if(o.status==="problem") toast(`Oznaczono problem przy #${o.number}. Ogarniemy to!`);
  else toast("Status zmieniony");
}
async function quickStatus(col, id, status){
  const r = S[col][id]; if(!r || r.status===status) return;
  const next = {...r, status};
  if(col==="orders" && status==="dostarczone") next.deliveredAt = Date.now();
  if(await put(col, id, next)){ if(col==="orders") afterOrderStatus(next, r.status); else logAct(`${r.name} → ${status}`); }
  else scheduleRender();
}
async function confirmDelete(){
  const btn = $("#modal [data-act='del']");
  if(btn && !btn.dataset.sure){ btn.dataset.sure = "1"; btn.textContent = "Na pewno usunąć?"; return; }
  const {col, id, prev} = modalCtx;
  if(await del(col, id)){ closeModal(); toast("Usunięto"); logAct(`Usunięto: ${SCHEMA[col].one} ${prev.name||prev.title||("#"+prev.number)}`); }
}

function openSettings(){
  const st = S.settings || {};
  const demoCount = COLS.reduce((s,c)=> s + arr(c).filter(r=>r.demo).length, 0);
  modalCtx = {settings:true};
  openModal(`<form id="frmS" novalidate>
    <div class="modal-h"><h2 id="mTitle">Ustawienia zespołu</h2><button type="button" class="btn ghost sm" data-act="close" aria-label="Zamknij">${ic("x",18)}</button></div>
    <div class="modal-b">
      ${team().map((p,i) => `<div class="f"><label for="t-${p.k}">Wspólnik ${i+1}: imię</label><div class="row" style="flex-wrap:nowrap">${avatar(p.k,32)}<input id="t-${p.k}" name="${p.k}" value="${esc(p.name)}"></div></div><div class="f"><label for="e-${p.k}">E-mail do logowania</label><input id="e-${p.k}" name="e-${p.k}" type="email" value="${esc(((st.emails||{})[p.k])||"")}" placeholder="żeby CRM sam wiedział, kto pracuje"></div>`).join("")}
      <div class="f"><label for="s-goal">Cel miesięczny (zł)</label><input id="s-goal" name="goal" inputmode="decimal" value="${esc(st.goal||10000)}"></div>
      <div class="f"><label for="s-gt">Cel liczymy jako</label><select id="s-gt" name="goalType"><option value="profit" ${st.goalType!=="revenue"?"selected":""}>Zysk na czysto</option><option value="revenue" ${st.goalType==="revenue"?"selected":""}>Przychód</option></select></div>
      <div class="f full"><label>Przykładowe dane</label><div class="row"><span class="small muted">${demoCount ? `${demoCount} wpisów oznaczonych jako „przykład”. Usuń je, gdy zaczniecie wpisywać prawdziwe dane.` : "Brak przykładowych danych. Wszystko tu jest Wasze."}</span>${demoCount?`<button type="button" class="btn danger sm" data-act="cleardemo">Usuń przykładowe dane</button>`:""}</div></div>
      <div class="f full"><label>Konto</label><span class="small muted">Zalogowano jako <b>${esc(sessionEmail)}</b>. Dane są we wspólnej bazie, zmiany wspólników widać na żywo.</span></div>
    </div>
    <div class="modal-f"><span></span><div class="row"><button type="button" class="btn" data-act="close">Anuluj</button><button type="submit" class="btn primary">Zapisz</button></div></div>
  </form>`);
}
async function submitSettings(){
  const fd = new FormData($("#frmS"));
  const t = {}, em = {}; ["p1","p2","p3"].forEach(k => { t[k] = String(fd.get(k)||"").trim().slice(0,30) || DEFAULT_TEAM[k]; em[k] = String(fd.get("e-"+k)||"").trim().toLowerCase().slice(0,120); });
  await putSettings({team:t, emails:em, goal: num(fd.get("goal")) || 10000, goalType: fd.get("goalType")==="revenue"?"revenue":"profit"});
  autoMe();
  closeModal(); toast("Ustawienia zapisane");
}
async function clearDemo(){
  const btn = $("#modal [data-act='cleardemo']");
  if(btn && !btn.dataset.sure){ btn.dataset.sure = "1"; btn.textContent = "Na pewno? Kliknij jeszcze raz"; return; }
  if(btn){ btn.disabled = true; btn.textContent = "Usuwam…"; }
  for(const c of COLS){ for(const r of arr(c).filter(x=>x.demo)){ await del(c, r.id); } }
  closeModal(); toast("Przykładowe dane usunięte. Czas na prawdziwe zamówienia!");
}

function openPass(){
  modalCtx = {pass:true};
  openModal(`<form id="frmP" novalidate>
    <div class="modal-h"><h2 id="mTitle">Moje hasło</h2><button type="button" class="btn ghost sm" data-act="close" aria-label="Zamknij">${ic("x",18)}</button></div>
    <div class="modal-b">
      <div class="f full"><span class="small muted">Konto: <b>${esc(sessionEmail)}</b>. Tym hasłem zalogujesz się na każdym urządzeniu.</span></div>
      <div class="f"><label for="p-1">Nowe hasło (min. 8 znaków)</label><input id="p-1" name="password" type="password" autocomplete="new-password"></div>
      <div class="f"><label for="p-2">Powtórz hasło</label><input id="p-2" name="password2" type="password" autocomplete="new-password"></div>
    </div>
    <div class="modal-f"><span></span><div class="row"><button type="button" class="btn" data-act="close">Anuluj</button><button type="submit" class="btn primary">Zapisz hasło</button></div></div>
  </form>`);
}
async function submitPass(f){
  const p = f.password.value, p2 = f.password2.value;
  if(p.length < 8){ toast("Hasło musi mieć co najmniej 8 znaków."); return; }
  if(p !== p2){ toast("Hasła się różnią."); return; }
  const { error } = await SB.auth.updateUser({ password: p });
  if(error){ toast("Nie udało się zapisać hasła: " + error.message); return; }
  closeModal(); toast("Hasło zapisane. Możesz nim logować się na komputerze.");
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-gate]"); if(g){ showGate(g.dataset.gate); return; }
  const t = e.target.closest("[data-nav],[data-new],[data-edit],[data-act],[data-period],[data-ofilter],[data-pfilter],[data-towner],[data-goto-orders],[data-move],[data-stop]");
  if(!t) { if(e.target === $("#scrim")) closeModal(); return; }
  if(t.dataset.stop !== undefined && !e.target.closest("[data-move]")) return;
  if(t.dataset.nav){ location.hash = t.dataset.nav; return; }
  if(t.dataset.new){ openForm(t.dataset.new); return; }
  if(t.dataset.move){ const [id,st] = t.dataset.move.split(":"); moveTask(id, st); return; }
  if(t.dataset.edit){ const [c,id] = t.dataset.edit.split(":"); if(S[c][id]) openForm(c,id); return; }
  if(t.dataset.period){ UI.period = t.dataset.period; render(); return; }
  if(t.dataset.ofilter){ UI.orderFilter = t.dataset.ofilter; render(); return; }
  if(t.dataset.pfilter){ UI.prodFilter = t.dataset.pfilter; render(); return; }
  if(t.dataset.towner){ UI.taskOwner = t.dataset.towner; render(); return; }
  if(t.dataset.gotoOrders){ UI.orderFilter = t.dataset.gotoOrders; location.hash = "zamowienia"; return; }
  const a = t.dataset.act;
  if(a==="close") closeModal(); else if(a==="settings") openSettings(); else if(a==="del") confirmDelete(); else if(a==="cleardemo") clearDemo(); else if(a==="logout") SB.auth.signOut(); else if(a==="setpass") openPass();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("#scrim").classList.contains("open")) closeModal();
  if(e.key === "Enter" && e.target.matches("[data-edit]:not(tr)") ) { e.target.click(); }
});
document.addEventListener("input", e => {
  if(e.target.dataset.q !== undefined){ UI.q[e.target.dataset.q] = e.target.value; render(); }
  if(e.target.closest("#frm") && modalCtx && modalCtx.col==="orders") updCalc();
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.id === "meSel"){ me = t.value; ls.set("crm_me", me); render(); return; }
  if(t.dataset.quick){ const [c,id] = t.dataset.quick.split(":"); quickStatus(c, id, t.value); return; }
  if(t.matches("[data-oowner]")){ UI.orderOwner = t.value; render(); return; }
  if(t.id === "f-productId" && modalCtx && modalCtx.col==="orders"){
    const p = byId("products", t.value); if(!p) return; const q = num($("#f-qty").value) || 1;
    if(!$("#f-price").value) $("#f-price").value = num(p.price)*q;
    if(!$("#f-cost").value) $("#f-cost").value = num(p.cost)*q;
    if(!$("#f-shipping").value && num(p.shipping)) $("#f-shipping").value = num(p.shipping);
    updCalc();
  }
});
document.addEventListener("submit", e => { e.preventDefault(); const id = e.target.id; if(id==="frm") submitForm(); else if(id==="frmS") submitSettings(); else if(id==="gLogin") doLogin(e.target); else if(id==="gForgot") doForgot(e.target); else if(id==="gNew") doNewPass(e.target); else if(id==="frmP") submitPass(e.target); });

/* ---------- toasts & confetti ---------- */
function toast(msg){ const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; $("#toasts").appendChild(el); setTimeout(()=>el.remove(), 3600); }
function celebrate(power=1){
  if(reduced) return;
  const cv = $("#fx"), ctx = cv.getContext("2d"); const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent","--accent-2","--p2","--p3","--warn"].map(v=>cs.getPropertyValue(v).trim()||"#f60");
  const P = Array.from({length: Math.round(110*power)}, () => ({x: W/2 + (Math.random()-.5)*W*.3, y: H*.35, vx:(Math.random()-.5)*14, vy: -Math.random()*12-4, r: Math.random()*6+4, c: cols[Math.floor(Math.random()*cols.length)], a: Math.random()*6, s:(Math.random()-.5)*.3}));
  let f = 0;
  (function tick(){
    ctx.clearRect(0,0,W,H);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - f/90); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(++f < 90) requestAnimationFrame(tick); else ctx.clearRect(0,0,W,H);
  })();
}

const VIEW_FNS = { pulpit:vDash, zamowienia:vOrders, produkty:vProducts, dostawcy:vSuppliers, klienci:vCustomers, zadania:vTasks, "sklepy-i-boty":vShops };
const CRM = {
  $, esc, num, fmtZl, uid, toast, openModal, closeModal, put, del, arr, byId, nameOf,
  logAct, scheduleRender, team, avatar, pill, ic, TODAY, SCHEMA, COLS, VIEWS, VIEW_FNS, DEFAULTS, S, UI,
  opt, ORDER_ST, PAY_ST, badgeFns, readyFns,
  get SB(){ return SB; },
  get me(){ return me; },
  get sessionEmail(){ return sessionEmail; },
  async reload(){
    await loadAll();
    for (const fn of readyFns) { try { await fn(); } catch (e) { console.error(e); } }
    scheduleRender();
  }
};
window.CRM_API = CRM;
(window.NHP_HOOKS || []).forEach((fn) => { try { fn(CRM); } catch (e) { console.error(e); } });
boot();
})();
</script>
