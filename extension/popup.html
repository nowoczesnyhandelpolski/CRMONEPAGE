<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHP import</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; width: 320px; font: 14px/1.4 system-ui, sans-serif; color: #1c1917; background: #faf8f5; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 18px; margin: 0; }
  p { margin: 0; color: #6e6862; font-size: 13px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: #6e6862; }
  input { border: 1px solid #e4dfd8; border-radius: 10px; padding: 8px 10px; font: inherit; color: inherit; background: #fff; }
  button { border: 0; border-radius: 10px; padding: 10px; background: #13294B; color: #fff; font-weight: 700; cursor: pointer; box-shadow: inset 0 -3px 0 #C8102E; }
  .logo { height: 40px; width: auto; display: block; }
  .row { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<main>
  <div class="row"><img class="logo" src="logo.svg" alt="Nowoczesny Handel Polski"><h1>Import do Centrali</h1></div>
  <p>Na karcie oferty Allegro naciśnij E albo przycisk „Zapisz w Centrali”. Klucz zostaje tylko w tej przeglądarce. Na serwerze trzymamy jego skrót.</p>
  <label>Adres panelu<input id="base" type="url" placeholder="https://panel.nowoczesnyhandelpolski.pl" autocomplete="off"></label>
  <label>Klucz API<input id="key" type="password" placeholder="nhp_…" autocomplete="off"></label>
  <button id="save" type="button">Zapisz ustawienia</button>
  <p id="msg"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
